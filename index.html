<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё Портфолио | Web Dev</title>
<!-- Подключаем красивый шрифт из Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

<style>
  /* ===== ПЕРЕМЕННЫЕ ЦВЕТОВ ===== */
  :root {
    --bg-color: #0f172a; /* Темный фон для "космоса" */
    --text-color: #f8fafc;
    --card-bg: rgba(255, 255, 255, 0.05); /* Полупрозрачное стекло */
    --card-border: rgba(255, 255, 255, 0.1);
    --accent: #8b5cf6; /* Фиолетовый */
    --accent-glow: rgba(139, 92, 246, 0.5);
    --shadow: 0 20px 50px rgba(0,0,0,0.5);
  }

  /* Светлая тема */
  .light-theme {
    --bg-color: #f1f5f9;
    --text-color: #0f172a;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-border: rgba(255, 255, 255, 0.9);
    --accent: #6366f1;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --shadow: 0 20px 40px rgba(0,0,0,0.1);
  }

  /* ===== БАЗА ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.5s ease, color 0.5s ease;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden; /* Убираем прокрутку, чтобы шары не вылезали */
    position: relative;
  }

  /* ===== ЖИВЫЕ ШАРЫ НА ФОНЕ ===== */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    animation: float 10s infinite ease-in-out alternate;
  }
  .orb1 { width: 300px; height: 300px; background: var(--accent); top: -100px; left: -100px; }
  .orb2 { width: 250px; height: 250px; background: #ec4899; bottom: -50px; right: -50px; animation-delay: -5s; }
  .orb3 { width: 200px; height: 200px; background: #06b6d4; top: 40%; left: 60%; animation-duration: 15s; }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(50px, 50px) scale(1.2); }
  }

  /* ===== КНОПКА ТЕМЫ ===== */
  .theme-btn {
    position: absolute;
    top: 30px;
    right: 30px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(10px);
    color: var(--text-color);
    padding: 12px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    box-shadow: var(--shadow);
    transition: all 0.3s ease;
    z-index: 10;
  }
  .theme-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px var(--accent-glow); }

  /* ===== СТЕКЛЯННАЯ КАРТОЧКА ===== */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px); /* Эффект матового стекла */
    -webkit-backdrop-filter: blur(20px);
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: var(--shadow);
    max-width: 650px;
    width: 90%;
    text-align: center;
    animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(50px);
    z-index: 1;
  }

  @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

  .avatar {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, var(--accent), #ec4899);
    border-radius: 50%;
    margin: 0 auto 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    box-shadow: 0 10px 30px var(--accent-glow);
    transition: transform 0.3s;
  }
  .avatar:hover { transform: scale(1.1) rotate(5deg); }

  h1 { font-size: 36px; font-weight: 900; margin-bottom: 15px; letter-spacing: -1px; }
  .highlight { color: var(--accent); }

  .typewriter {
    font-size: 18px;
    color: var(--text-color);
    opacity: 0.8;
    min-height: 30px;
    font-weight: 400;
    margin-bottom: 40px;
  }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 18px;
    background: var(--accent);
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== КНОПКА НАВЫКОВ ===== */
  .skills-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 16px 40px;
    font-size: 18px;
    border-radius: 15px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 10px 20px var(--accent-glow);
    transition: all 0.3s;
    width: 100%;
    max-width: 300px;
  }
  .skills-btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 30px var(--accent-glow); }
  .skills-btn:active { transform: translateY(0) scale(0.98); }

  /* ===== НАВЫКИ ===== */
  .skills-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    margin-top: 0;
  }
  .skills-list.open { max-height: 400px; margin-top: 25px; }

  .skill-item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--card-border);
    padding: 15px;
    border-radius: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: 700;
    font-size: 14px;
    transition: all 0.3s;
  }
  .skill-item:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
  .skill-icon { font-size: 24px; }

  @media (max-width: 600px) {
    .card { padding: 30px 20px; }
    h1 { font-size: 26px; }
    .skills-list { grid-template-columns: 1fr; }
    .theme-btn { top: 15px; right: 15px; padding: 8px 16px; font-size: 14px; }
  }
</style>
</head>
<body class="light-theme">

  <!-- Живые шары на фоне -->
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <!-- Кнопка смены темы -->
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 Ночь</button>

  <div class="card">
    <div class="avatar">🚀</div>
    <h1>Привет, я <span class="highlight">Веб-Разработчик</span>!</h1>
    
    <div class="typewriter">
      <span id="typewriterText"></span><span class="cursor"></span>
    </div>

    <button class="skills-btn" onclick="toggleSkills()">Мои крутые навыки 👇</button>

    <div class="skills-list" id="skillsList">
      <div class="skill-item"><span class="skill-icon">🟧</span> HTML5</div>
      <div class="skill-item"><span class="skill-icon">🟦</span> CSS3</div>
      <div class="skill-item"><span class="skill-icon">🟨</span> JavaScript</div>
      <div class="skill-item"><span class="skill-icon">🐙</span> GitHub Pages</div>
    </div>
  </div>

<script>
  // 1. Смена темы
  function toggleTheme() {
    document.body.classList.toggle('light-theme');
    const btn = document.getElementById('themeBtn');
    // Если класс light-theme есть - значит светлая, показываем луну. Иначе - солнце.
    if (document.body.classList.contains('light-theme')) {
      btn.textContent = '🌙 Ночь';
    } else {
      btn.textContent = '☀️ День';
    }
  }

  // 2. Выпадающий список
  function toggleSkills() {
    document.getElementById('skillsList').classList.toggle('open');
  }

  // 3. Печатающийся текст
  const textToType = "Создаю сайты, которые выглядят дорого. Это мой 2-й проект!";
  const textElement = document.getElementById('typewriterText');
  let i = 0;

  function typeText() {
    if (i < textToType.length) {
      textElement.textContent += textToType.charAt(i);
      i++;
      setTimeout(typeText, 60);
    }
  }
  setTimeout(typeText, 500);
</script>
</body>
</html>
